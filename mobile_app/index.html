<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Real-time mobile dashboard for Sentry-Swarm multi-agent DevOps incident response — monitor active incidents, pipeline progress, and resolution metrics.">
  <meta name="theme-color" content="#0b0f19">
  <title>Sentry-Swarm Mobile Responder</title>
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --panel-bg: rgba(22, 30, 49, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.3);
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --critical: #dc2626;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      line-height: 1.5;
      padding: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-logo {
      background: linear-gradient(135deg, var(--primary), var(--success));
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.25rem;
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .brand-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--error);
      box-shadow: 0 0 8px var(--error);
    }

    .status-badge.connected .status-dot {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      border-color: rgba(99, 102, 241, 0.2);
    }

    #incidents {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .empty-icon {
      font-size: 2rem;
      opacity: 0.5;
    }

    /* Incident Card Styles */
    .incident-card {
      background: rgba(30, 41, 59, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .incident-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .incident-type {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .badge-critical { background: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.3); }
    .badge-high { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-medium { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-low { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

    .incident-meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 0;
    }

    .meta-item strong {
      color: var(--text-main);
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.025em;
      margin-bottom: 0.15rem;
    }

    /* Progress Steps UI */
    .steps-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      margin: 0.5rem 0;
      padding: 0 0.5rem;
    }

    .steps-progress-bar {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-50%);
      z-index: 1;
    }

    .steps-progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.4s ease;
    }

    .step-node {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .step-circle {
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 50%;
      background: #1e293b;
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .step-node.active .step-circle {
      background: var(--bg-color);
      border-color: var(--warning);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
      color: var(--warning);
    }

    .step-node.complete .step-circle {
      background: var(--success);
      border-color: var(--success);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
      color: white;
    }

    .step-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .step-node.active .step-label {
      color: var(--warning);
    }

    .step-node.complete .step-label {
      color: var(--success);
    }

    .incident-details {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      border-left: 3px solid var(--primary);
    }

    .detail-heading {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .detail-body {
      font-size: 0.85rem;
      white-space: pre-line;
      color: var(--text-main);
    }

    .fix-plan-list {
      margin-top: 0.5rem;
      padding-left: 1.25rem;
      font-size: 0.85rem;
    }

    .fix-plan-list li {
      margin-bottom: 0.25rem;
    }

    /* Resolved Logs */
    .resolved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    .resolved-item:last-child {
      border-bottom: none;
    }

    .resolved-info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .resolved-name {
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .resolved-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .resolved-mttd {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div class="brand-title">
        <h1>Sentry-Swarm</h1>
        <p>DevOps Mobile Responder</p>
      </div>
    </div>
    <div id="connection-status" class="status-badge" aria-label="Connection status">
      <div class="status-dot"></div>
      <span id="connection-text">Connecting</span>
    </div>
  </header>

  <main>
    <section>
      <div class="section-title">
        <span>🚨</span> Active Incidents
      </div>
      <div id="incidents" role="region" aria-live="polite" aria-label="Active incidents">
        <div class="card empty-state">
          <div class="empty-icon">🛡️</div>
          <p>No active incidents. System is fully operational.</p>
        </div>
      </div>
    </section>

    <section>
      <div class="section-title">
        <span>✅</span> Recently Resolved
      </div>
      <div class="card" style="padding: 0;">
        <div id="resolved-list">
          <div class="empty-state" style="padding: 2rem 1rem;">
            <p>No recently resolved incidents in this session.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
